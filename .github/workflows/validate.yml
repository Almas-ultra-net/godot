name: Validate Project

on:
  push:
    branches: [ main, master, arena/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy gdtoolkit
      - name: Lint GDScript
        run: gdlint scripts/*.gd
      - name: Validate resources
        run: python scripts_tools/validate_project.py
